# ==============================================================================
# LLM Enterprise Hub - 生产级核心配置字典
# ==============================================================================

spring:
  application:
    name: llm-enterprise-hub
  threads:
    virtual:
      enabled: true                  # 启用 Java 21 虚拟线程支持高并发吞吐
  datasource:
    url: jdbc:sqlite:hub-data.db     # SQLite 本地持久化数据库路径
    driver-class-name: org.sqlite.JDBC
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

server:
  port: 8080                         # 服务监听端口

# ------------------------------------------------------------------------------
# 1. 大模型推理引擎配置 (Remote Inference Cluster Auto-Discovery & Local Fallback)
# ------------------------------------------------------------------------------
llm:
  # 远程 GPU 推理集群自感知 (支持 K8s Headless DNS、端点模型自省或静态列表，可选)
  cluster:
    enabled: false                           # 集群自感知开关 (设为 true 时优先路由远程集群)
    dns-discovery: ""                        # K8s Headless Service 域名 (例如 vllm-headless.inference.svc.cluster.local:8000)
    static-nodes: ""                         # 静态节点列表 (逗号分隔，例如 http://10.0.1.11:8000/v1,http://10.0.1.12:8000/v1)
    discovery-interval-seconds: 15           # 拓扑刷新与探活周期 (秒)

  # 本地默认开发与终极灾备兜底模型 (Default & Safety Net)
  provider:
    base-url: "http://localhost:11434/v1"   # 主模型 API 端点 (OpenAI 兼容 / Ollama / 云端)
    api-key: "ollama"                       # 主模型 API Key
    model: "qwen2.5:0.5b"                   # 主模型名称
    timeout-seconds: 60                     # 请求超时时间（秒）
  fallback:
    base-url: "http://localhost:11434/v1"   # 熔断降级模型 API 端点 (本地 Ollama 兜底)
    api-key: "ollama"                       # 降级模型 API Key
    model: "qwen2.5:0.5b"                   # 降级模型名称

# ------------------------------------------------------------------------------
# 2. 全链路双向安全护栏配置 (Prompt Guardrail, DLP, Tool Isolation)
# ------------------------------------------------------------------------------
security:
  # 提示词注入防护 (Ingress Guardrail)
  guardrail:
    prompt:
      enabled: true
      patterns:
        - "(?i)ignore\\s+(all\\s+)?(previous|prior|above)\\s+instructions"
        - "(?i)disregard\\s+(all\\s+)?(previous|prior|above)\\s+instructions"
        - "(?i)you\\s+are\\s+now\\s+in\\s+dan\\s+mode"
        - "(?i)reveal\\s+your\\s+(system\\s+prompt|instructions)"
        - "(?i)output\\s+(all\\s+)?passwords?"
        - "(?i)jailbreak"
        - "(?i)system\\s*:\\s*override"

  # 数据防泄漏脱敏 (Egress DLP Guardrail)
  dlp:
    enabled: true
    rules:
      - id: jwt
        name: "JWT Authentication Token"
        pattern: "\\bey[A-Za-z0-9_-]{10,}\\.[A-Za-z0-9_-]{10,}\\.[A-Za-z0-9_-]+\\b"
        mask-type: REPLACE_TAG
        replacement: "[REDACTED_JWT]"
        enabled: true
      - id: openai_key
        name: "OpenAI API Key"
        pattern: "\\bsk-[a-zA-Z0-9_-]{20,}\\b"
        mask-type: REPLACE_TAG
        replacement: "[REDACTED_API_KEY]"
        enabled: true
      - id: aws_key
        name: "AWS Access Key ID"
        pattern: "\\bAKIA[0-9A-Z]{16}\\b"
        mask-type: REPLACE_TAG
        replacement: "[REDACTED_AWS_KEY]"
        enabled: true
      - id: phone
        name: "Chinese 11-digit Mobile Phone"
        pattern: "(?<!\\d)1[3-9]\\d{9}(?!\\d)"
        mask-type: REPLACE_TAG
        replacement: "[REDACTED_PHONE]"
        enabled: true
      - id: email
        name: "Email Address"
        pattern: "\\b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}\\b"
        mask-type: REPLACE_TAG
        replacement: "[REDACTED_EMAIL]"
        enabled: true

  # Agent 工具调用安全沙箱与多租户隔离
  tools:
    enabled: true
    tenant-isolation-enabled: true
    tenant-identity-fields:
      - "tenant_id"
      - "tenantid"
      - "tenant"
      - "org_id"
      - "orgid"
      - "account_id"
      - "accountid"
    danger-patterns:
      - "(?i)rm\\s+(-[a-zA-Z]*r[a-zA-Z]*f|--recursive|-[a-zA-Z]*f[a-zA-Z]*r)"
      - "(?i)drop\\s+table"
      - "(?i)drop\\s+database"
      - "(?i)truncate\\s+table"
      - "(?i)truncate\\s+[a-zA-Z0-9_]+"
      - "(?i)format\\s+[a-z]:"
      - "(?i)mkfs(\\.[a-z0-9]+)?\\s+"
      - "(?i)shutdown\\s+-h"
      - "(?i)reboot"
      - "(?i)kill\\s+-9\\s+1\\b"

# ------------------------------------------------------------------------------
# 3. 智能两级缓存配置 (L1 Exact Hash + L2 Semantic Jaccard)
# ------------------------------------------------------------------------------
cache:
  enabled: true                     # 两级缓存总开关
  ttl-seconds: 3600                 # 缓存条目存活时间（秒，默认 1 小时）
  semantic-threshold: 0.88          # L2 语义相似度阈值 (0.0 ~ 1.0)
  max-capacity: 10000               # 缓存最大条目数

# ------------------------------------------------------------------------------
# 4. 企业级 RAG 检索增强与 Milvus 向量库配置
# ------------------------------------------------------------------------------
rag:
  enabled: true                     # RAG 前置检索流水线总开关
  top-k: 3                          # 默认召回切片数量
  min-score: 0.5                    # 最小相似度过滤阈值
  embedding:
    base-url: "http://localhost:11434/v1"  # 向量化服务端点 (OpenAI / Ollama)
    api-key: "ollama"                      # 向量化服务 API Key
    model: "bge-m3"                        # 向量化模型名称

milvus:
  endpoint: "http://127.0.0.1:19530"       # Milvus 2.x 集群 RESTful 端点 (设为 disabled 时走内存余弦检索)
  collection: "enterprise_hub_rag"         # 向量集合名称
  api-key: ""                              # Milvus 鉴权 Token (可选)

# ------------------------------------------------------------------------------
# 5. 管理员控制面与监控看板鉴权配置
# ------------------------------------------------------------------------------
admin:
  secret-key: "test-admin-secret-key-12345"  # 管理员 X-Admin-Key

# ------------------------------------------------------------------------------
# 6. 全链路日志与 MDC 格式配置
# ------------------------------------------------------------------------------
logging:
  pattern:
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr([%15.15t]){faint} %clr(%-5p) %clr([%X{traceId:-}][%X{tenantId:-}]){cyan} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n%wEx"

# ------------------------------------------------------------------------------
# 7. Actuator & Prometheus 监控度量配置
# ------------------------------------------------------------------------------
management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true
  prometheus:
    metrics:
      export:
        enabled: true


